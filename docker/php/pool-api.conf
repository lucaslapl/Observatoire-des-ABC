; Pool PHP-FPM « api » : sert exclusivement l'API publique /api/v1/*
; (nginx route ce préfixe vers ce socket). Workers statiques et limités :
; un pic de trafic tiers ne peut jamais priver le site public de ses
; process — il n'y a que pm.max_children workers pour tout /api/v1.
[api]
user = www-data
group = www-data

listen = /run/php/api.sock
listen.owner = www-data
listen.group = www-data

clear_env = no

pm = static
pm.max_children = 4

; Les réponses sont de toute façon en cache (CacheApiResponse) : une
; requête lente est tuée plutôt que d'occuper un worker du pool.
request_terminate_timeout = 30s
