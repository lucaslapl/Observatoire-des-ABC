; Pool PHP-FPM « www » : sert le site public (pages Inertia, API
; historique non versionnée utilisée par la carte du site).
; Les workers sont dynamiques : le site garde toujours ses process,
; quoi que fasse le trafic API.
[www]
user = www-data
group = www-data

listen = /run/php/www.sock
listen.owner = www-data
listen.group = www-data

; L'héritage des variables d'environnement du conteneur (DB_HOST=postgis,
; MAIL_HOST=mailpit…) est indispensable : sans clear_env=no, les workers
; reliraient le .env bind-mounté au lieu de la configuration Docker.
clear_env = no

pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
