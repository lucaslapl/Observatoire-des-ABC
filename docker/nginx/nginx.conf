user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/geo+json image/svg+xml;

    server {
        listen 8000;
        server_name _;

        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # --- API publique v1 : pool PHP-FPM dédié (docker/php/pool-api.conf).
        # ^~ : aucune requête sous /api/v1/ ne peut retomber sur le pool du
        # site, même avec une extension .php. Les réponses étant de toute
        # façon mises en cache applicativement, la charge de ce pool est
        # bornée (4 workers) : un pic tiers ne touche jamais le site.
        location ^~ /api/v1/ {
            include fastcgi_params;
            # Le fastcgi_params de Debian écrase HTTP_HOST avec $host (sans
            # le port) : Laravel générerait des URLs d'assets sur le port 80
            # → page blanche. On restitue le Host du client, port compris.
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass unix:/run/php/api.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }

        # --- Site public (et API historique non versionnée, utilisée par
        # la carte du site) : pool www.
        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_pass unix:/run/php/www.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
