name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: PHP 8.3 + Node 24 (build, tests, style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, intl, dom, xml
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # vendor est requis avant npm run build : resources/js/app.js importe
      # Ziggy depuis vendor/tightenco/ziggy.
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # Les tests PHPUnit rendent des pages Inertia (@vite → manifest.json)
      # et le watchdog SSR lance bootstrap/ssr/ssr.js : le build est requis.
      - name: Build frontend
        run: npm run build

      - name: Copy environment
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Generate application key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: php artisan test

      - name: Run JS tests (node --test)
        run: npm run test:js

      - name: Run Pint (style)
        run: ./vendor/bin/pint --test

      - name: Run PHPStan (Larastan, level 5)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
