                        example: '<p>La ZNIEFF est composée de la vallée du Viaur et de ses affluents. Le bassin versant du Viaur recouvre 61 communes aveyronnaises, 11 communes tarnaises et une commune du Tarn-et-Garonne, soit au total 73 communes. À Tanus, le Viaur sort du département de l’Aveyron pour servir, durant une bonne partie de son cours, de limite entre les départements du Tarn et de l’Aveyron. Quelques secteurs dans sa partie aval sont entièrement inclus dans le département du Tarn. Le Viaur, affluent rive gauche de l’Aveyron, prend sa source au sud du puech del Pal sur la commune de Vézins-du-Lévézou, à une altitude de 1 090 m. Il serpente d’est en ouest à travers deux grandes régions naturelles que sont le Lévézou et le Ségala. Après un parcours de 163 km, il conflue avec l’Aveyron au niveau de Saint-Martin-Laguépie (département du Tarn) et Laguépie (département du Tarn-et-Garonne) à une altitude de 150 m. La ZNIEFF abrite une flore et une faune remarquables et diversifiées.</p>'
