                  example: 1
                  nullable: true
                code_insee:
                  type: string
                  description: 'Must match the regex /^[0-9A-Z]{5}$/i.'
                  example: T8GOX$/i
                  nullable: true
                departement:
                  type: string
                  description: 'Must match the regex /^[0-9a-zA-Z]{1,3}$/.'
                  example: b
                  nullable: true
                region:
                  type: string
                  description: 'Must not be greater than 60 characters.'
