openapi: 3.0.3
info:
  title: 'API publique v1 — Observatoire des ABC'
  description: "API publique en lecture seule de l'Observatoire des ABC : projets ABC, communes, départements, régions, journal d'audit et statistiques. Données sous Licence Ouverte 2.0 (Etalab). Accès ouvert sans clé, 60 requêtes/min par IP."
  version: 1.0.0
servers:
  -
    url: 'https://observatoire-abc.fr'
tags:
  -
    name: Communes
    description: ''
  -
    name: Départements
    description: ''
  -
    name: Journal
    description: ''
  -
    name: 'Patrimoine INPN'
    description: ''
  -
    name: Projets
    description: ''
  -
    name: Régions
    description: ''
  -
    name: Statistiques
    description: ''
paths:
  '/api/v1/communes/{code}':
    get:
      summary: "Fiche d'une commune : localisation, EPCI, projets liés (avec\nprovenance de chaque projet). Format GeoJSON avec `format=geojson`\nou `Accept: application/geo+json` (une feature par projet lié)."
      operationId: ficheDuneCommuneLocalisationEPCIProjetsLisavecProvenanceDeChaqueProjetFormatGeoJSONAvecformatgeojsonOuAcceptApplicationgeo+jsonuneFeatureParProjetLi
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Communes
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  description: ''
                  example: json
                  enum:
                    - json
                    - geojson
                  nullable: true
      security: []
    parameters:
      -
        in: path
        name: code
        description: 'Code INSEE de la commune (ex. 56003).'
        example: architecto
        required: true
        schema:
          type: string
  '/api/v1/departements/{code}':
    get:
      summary: "Synthèse d'un département : communes et projets couverts,\nprovenance de chaque projet."
      operationId: synthseDunDpartementCommunesEtProjetsCouvertsProvenanceDeChaqueProjet
      description: ''
      parameters: []
      responses:
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: ''
                properties:
                  message:
                    type: string
                    example: ''
      tags:
        - Départements
      security: []
    parameters:
      -
        in: path
        name: code
        description: 'Code du département (ex. 56, 2a, 972).'
        example: architecto
        required: true
        schema:
          type: string
  /api/v1/journal:
    get:
      summary: "Journal public d'audit : vérifications, contributions validées,\nfusions… dans le même ordre que sur le site (le plus récent\nd'abord), paginé par curseur. Les auteurs sont anonymisés : les\ncontributions sont créditées collectivement, jamais nominativement."
      operationId: journalPublicDauditVrificationsContributionsValidesFusionsDansLeMmeOrdreQueSurLeSitelePlusRcentDabordPaginParCurseurLesAuteursSontAnonymissLesContributionsSontCrditesCollectivementJamaisNominativement
      description: ''
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      date: '2026-10-28 11:38:13'
                      label: 'Projet retiré de la carte'
                      detail: null
                      auteur: 'un administrateur'
                      commune: null
                      projet_nom: "ABC d'Ambérieu-en-Bugey"
                      projet_slug: null
                      projet_id: abc-d-amberieu-en-bugey-amberieu-en-bugey-2014
                  meta:
                    per_page: 1
                    next_cursor: eyJjcmVhdGVkX2F0IjoiMjAyNi0xMC0yOCAxMTozODoxMyIsImlkIjoyODMsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0
                    prev_cursor: null
                    next_page_url: 'https://observatoire-abc.fr/api/v1/journal?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNi0xMC0yOCAxMTozODoxMyIsImlkIjoyODMsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0'
                    licence: Etalab-2.0
                properties:
                  data:
                    type: array
                    example:
                      -
                        date: '2026-10-28 11:38:13'
                        label: 'Projet retiré de la carte'
                        detail: null
                        auteur: 'un administrateur'
                        commune: null
                        projet_nom: "ABC d'Ambérieu-en-Bugey"
                        projet_slug: null
                        projet_id: abc-d-amberieu-en-bugey-amberieu-en-bugey-2014
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2026-10-28 11:38:13'
                        label:
                          type: string
                          example: 'Projet retiré de la carte'
                        detail:
                          type: string
                          example: null
                          nullable: true
                        auteur:
                          type: string
                          example: 'un administrateur'
                        commune:
                          type: string
                          example: null
                          nullable: true
                        projet_nom:
                          type: string
                          example: "ABC d'Ambérieu-en-Bugey"
                        projet_slug:
                          type: string
                          example: null
                          nullable: true
                        projet_id:
                          type: string
                          example: abc-d-amberieu-en-bugey-amberieu-en-bugey-2014
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 1
                      next_cursor:
                        type: string
                        example: eyJjcmVhdGVkX2F0IjoiMjAyNi0xMC0yOCAxMTozODoxMyIsImlkIjoyODMsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
                      next_page_url:
                        type: string
                        example: 'https://observatoire-abc.fr/api/v1/journal?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNi0xMC0yOCAxMTozODoxMyIsImlkIjoyODMsIl9wb2ludHNUb05leHRJdGVtcyI6dHJ1ZX0'
                      licence:
                        type: string
                        example: Etalab-2.0
      tags:
        - Journal
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 100.'
                  example: 1
                  nullable: true
                format:
                  type: string
                  description: ''
                  example: json
                  enum:
                    - json
                  nullable: true
      security: []
