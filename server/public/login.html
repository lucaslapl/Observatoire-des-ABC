<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Observatoire des ABC — Connexion</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" />
  <style>
    body { background:#f1f5f9; color:#0f172a; }
    .navbar-abc { background:#14532d; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-abc py-2">
    <div class="container-fluid">
      <a class="navbar-brand fs-6 mb-0" href="/">🔐 Observatoire des ABC — Connexion</a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-light" href="/">← Carte</a>
      </div>
    </div>
  </nav>

  <main class="d-flex align-items-center justify-content-center px-3" style="min-height:calc(100vh - 60px)">
    <div class="card shadow-sm w-100" style="max-width:360px">
      <div class="card-body p-4">
        <h2 class="h5 mb-3">Connexion administrateur</h2>
        <label class="form-label">Identifiant</label>
        <input type="text" id="username" class="form-control" autocomplete="username" />
        <label class="form-label mt-3">Mot de passe</label>
        <input type="password" id="password" class="form-control" autocomplete="current-password" />
        <button id="loginBtn" class="btn btn-success w-100 mt-3">Se connecter</button>
        <div id="loginErr" class="text-danger small mt-2"></div>
      </div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    $('loginBtn').addEventListener('click', async () => {
      const err = $('loginErr');
      err.textContent = '';
      $('loginBtn').disabled = true;
      $('loginBtn').textContent = '…';
      try {
        const r = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ username: $('username').value, password: $('password').value }),
        });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Erreur inconnue');
        window.location.href = '/admin';
      } catch (e) {
        err.textContent = e.message;
        $('loginBtn').disabled = false;
        $('loginBtn').textContent = 'Se connecter';
      }
    });

    $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

    fetch('/api/admin/me').then(r => r.json()).then(j => {
      if (j.admin) window.location.href = '/admin';
    });
  </script>
</body>
</html>
