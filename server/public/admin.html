<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Observatoire des ABC — Administration</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" />
  <style>
    [hidden] { display:none !important; }
    body { background:#f1f5f9; color:#0f172a; }
    .navbar-abc { background:#14532d; }
    #panel { display:none; }
    .chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:#e2e8f0; color:#334155; }
    .chip.en_attente { background:#fef9c3; color:#854d0e; }
    .chip.validee { background:#e8f5e9; color:#1b5e20; }
    .chip.refusee { background:#fde8e8; color:#7f1d1d; }
    .chip.retiree { background:#e2e8f0; color:#475569; }
    .payload { margin-top:6px; font-size:13px; background:#f8fafc; border-radius:6px; padding:8px 10px; white-space:pre-wrap; word-break:break-word; border:1px solid #e9ecef; }
    .payload b { color:#0f172a; }
    .foot { margin-top:20px; font-size:12px; color:#64748b; line-height:1.6; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-abc py-2">
    <div class="container-fluid">
      <a class="navbar-brand fs-6 mb-0" href="/">🛡 Observatoire des ABC — Administration</a>
      <div class="d-flex align-items-center gap-2">
        <a class="btn btn-sm btn-outline-light" href="/">← Carte</a>
        <a class="btn btn-sm btn-outline-light" href="/verify">Vérification</a>
        <span id="user" class="text-white-50 small"></span>
        <button id="logoutBtn" class="btn btn-sm btn-outline-danger" hidden>Déconnexion</button>
      </div>
    </div>
  </nav>

  <div id="panel">
    <div class="container py-3">
      <div class="card shadow-sm mb-3">
        <div class="card-header bg-white fw-semibold py-2">Maintenance</div>
        <div class="card-body py-2">
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <button id="collectBtn" class="btn btn-primary btn-sm">🔄 Collecter les données</button>
            <button id="backupBtn" class="btn btn-secondary btn-sm">💾 Sauvegarder la base</button>
            <span id="maintenanceSpinner" class="spinner-border spinner-border-sm text-success" role="status" hidden></span>
          </div>
          <div id="maintenanceMsg" class="small mt-1 text-body-secondary"></div>
        </div>
      </div>
    </div>
    <div class="bg-white border-bottom">
      <ul class="nav nav-tabs px-3 pt-2">
        <li class="nav-item"><button class="tab nav-link active" data-tab="en_attente">À modérer</button></li>
        <li class="nav-item"><button class="tab nav-link" data-tab="validee">Appliquées</button></li>
        <li class="nav-item"><button class="tab nav-link" data-tab="historique">Refusées / retirées</button></li>
        <li class="nav-item"><button class="tab nav-link" data-tab="toutes">Toutes</button></li>
      </ul>
    </div>
    <main class="container py-3">
      <div id="content"></div>
      <p class="foot">
        RGPD : l'adresse IP des contributeurs est conservée uniquement pour la modération des
        corrections et ne sert à aucun autre traitement.
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const ETAT_LABEL = { en_attente: 'en attente', validee: 'validée', refusee: 'refusée', retiree: 'retirée' };

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function payloadLines(payload) {
      const p = payload || {};
      const out = [];
      if (p.statut_suggere) {
        const labels = { termine: 'Terminé', en_cours: 'En cours', va_debuter: 'Va débuter' };
        out.push(`<b>Statut suggéré :</b> ${labels[p.statut_suggere] || p.statut_suggere}`);
      }
      if (p.annee_debut_suggeree || p.annee_fin_suggeree) {
        const d = p.annee_fin_suggeree ? `${esc(p.annee_debut_suggeree)}–${esc(p.annee_fin_suggeree)}` : esc(p.annee_debut_suggeree);
        out.push(`<b>Dates suggérées :</b> ${d}`);
      }
      if (p.source) out.push(`<b>Source :</b> ${esc(p.source)}`);
      if (p.note) out.push(`<b>Note :</b> ${esc(p.note)}`);
      if (p.lien) out.push(`<b>Lien :</b> <a href="${esc(p.lien)}" target="_blank" rel="noopener">${esc(p.lien)}</a>`);
      if (p.texte) out.push(`<b>Texte :</b> ${esc(p.texte)}`);
      return out.join('\n');
    }

    function goLogin() {
      window.location.href = '/login';
    }

    async function api(url, opts) {
      const r = await fetch(url, opts);
      if (r.status === 401) { goLogin(); throw new Error('Non autorisé'); }
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    }

    function showPanel(username) {
      $('panel').style.display = 'block';
      $('user').textContent = 'Connecté : ' + username;
      $('logoutBtn').hidden = false;
      window.scrollTo(0, 0);
      load('en_attente');
    }

    function card(c, actions) {
      const payload = JSON.parse(c.payload_json || '{}');
      const commune = (c.communes || '').split(',')[0];
      return `<div class="card shadow-sm mb-2">
        <div class="card-header bg-white d-flex flex-wrap align-items-center gap-2 py-2">
          <span class="chip ${c.statut}">${ETAT_LABEL[c.statut] || c.statut}</span>
          <span class="proj fw-semibold">${esc(c.projet_nom || c.projet_id)}</span>
          <span class="text-body-secondary small">· ${esc(c.type)}</span>
        </div>
        <div class="card-body py-2">
          <div class="small text-body-secondary">${esc(commune || '')}${c.structure_porteuse ? ' · ' + esc(c.structure_porteuse) : ''} · IP ${esc(c.ip)} · ${esc(c.created_at)}${c.user_agent ? ' · ' + esc(c.user_agent.slice(0, 60)) : ''}</div>
          ${c.commentaire ? `<div class="small text-body-secondary mt-1">💬 ${esc(c.commentaire)}</div>` : ''}
          <div class="payload">${payloadLines(payload)}</div>
          ${c.note_admin ? `<div class="small text-body-secondary mt-1">Note admin : ${esc(c.note_admin)}</div>` : ''}
          ${c.traite_par ? `<div class="small text-body-secondary">Traité par ${esc(c.traite_par)} le ${esc(c.traite_le)}</div>` : ''}
          ${c.verif_etat && c.verif_etat !== 'a_verifier' ? `<div class="small text-body-secondary">Verdict actuel : ${esc(c.verif_etat)}</div>` : ''}
          ${actions ? `<div class="d-flex gap-2 flex-wrap mt-2">${actions}</div>` : ''}
        </div>
      </div>`;
    }

    function render(cs, tab) {
      const box = $('content');
      const list = tab === 'en_attente' ? cs.filter((c) => c.statut === 'en_attente')
        : tab === 'validee' ? cs.filter((c) => c.statut === 'validee')
        : tab === 'historique' ? cs.filter((c) => c.statut === 'refusee' || c.statut === 'retiree')
        : cs;
      if (list.length === 0) { box.innerHTML = '<div class="text-center text-body-secondary py-5">Aucune contribution.</div>'; return; }
      box.innerHTML = list.map((c) => {
        const valider = c.statut === 'en_attente'
          ? `<button class="btn btn-sm btn-success" data-act="valider" data-id="${c.id}">✓ Valider</button>
             <button class="btn btn-sm btn-danger" data-act="refuser" data-id="${c.id}">✗ Refuser</button>`
          : '';
        const retirer = c.statut === 'validee'
          ? `<button class="btn btn-sm btn-warning" data-act="retirer" data-id="${c.id}">↩ Retirer (rollback)</button>`
          : '';
        return card(c, valider + retirer);
      }).join('');
    }

    async function load(tab) {
      try {
        const j = await api('/api/admin/contributions');
        render(j.contributions, tab);
      } catch (e) {
        if (e.message === 'Non autorisé') { goLogin(); return; }
        $('content').innerHTML = '<div class="text-body-secondary py-5 text-center">Erreur : ' + esc(e.message) + '</div>';
      }
    }

    document.querySelectorAll('.tab').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        load(b.dataset.tab);
      });
    });

    $('content').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      const id = btn.dataset.id;
      let body = undefined;
      if (act === 'refuser') {
        const note = prompt('Note de refus (optionnelle) :');
        if (note === null) return;
        body = JSON.stringify({ note_admin: note });
      }
      try {
        await api(`/api/admin/contributions/${id}/${act}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body });
        const active = document.querySelector('.tab.active').dataset.tab;
        load(active);
      } catch (err) { alert(err.message); }
    });

    $('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      goLogin();
    });

    function maintenanceMsg(html, ok) {
      $('maintenanceMsg').innerHTML = html;
      $('maintenanceMsg').style.color = ok ? '#166534' : '#dc2626';
    }

    $('backupBtn').addEventListener('click', async () => {
      $('maintenanceSpinner').hidden = false;
      $('backupBtn').disabled = true;
      try {
        const j = await api('/api/admin/backup', { method: 'POST' });
        const time = j.path.replace(/^.*abc-(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})\..*$/, '$3/$2/$1 $4:$5:$6');
        maintenanceMsg(`Sauvegarde créée : ${time} (${j.kept} sauvegardes conservées).`, true);
      } catch (e) {
        maintenanceMsg('Erreur : ' + esc(e.message), false);
      } finally {
        $('maintenanceSpinner').hidden = true;
        $('backupBtn').disabled = false;
      }
    });

    $('collectBtn').addEventListener('click', async () => {
      if (!confirm('Lancer la collecte des données ? Cela va effacer et reconstruire toute la base.')) return;
      $('maintenanceSpinner').hidden = false;
      $('collectBtn').disabled = true;
      try {
        const j = await api('/api/admin/collect', { method: 'POST', signal: AbortSignal.timeout(300000) });
        const statusLines = (j.summary.statuses || []).map(s => `${esc(s.statut)}: ${s.n}`).join(', ');
        maintenanceMsg(`Collecte terminée : ${j.summary.total} projets, ${j.summary.communes} communes (${j.summary.geocoded} géocodées). ${statusLines}`, true);
        load(document.querySelector('.tab.active').dataset.tab);
      } catch (e) {
        maintenanceMsg('Erreur : ' + esc(e.message), false);
      } finally {
        $('maintenanceSpinner').hidden = true;
        $('collectBtn').disabled = false;
      }
    });

    fetch('/api/admin/me').then((r) => r.json()).then((j) => {
      if (j.admin) {
        showPanel(j.username || 'admin');
      } else {
        goLogin();
      }
    });
  </script>
</body>
</html>
